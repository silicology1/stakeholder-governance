[package]
name = "stakeholder_governance_modular"
version = "0.1.0"
edition = "2024_07"
license = "MIT"

# Split of the monolithic `stakeholder_governance` package into four
# `#[starknet::contract]` classes built from a single package:
#   ConvictionToken, Selection, Governance, AdminTimelock.

[dependencies]
starknet = "2.20.0"
openzeppelin_token = "3.0.0"
openzeppelin_interfaces = "2.2.0"
openzeppelin_access = "3.0.0"
openzeppelin_introspection = "3.0.0"
openzeppelin_security = "3.0.0"
openzeppelin_upgrades = "3.0.0"
cartridge_vrf = { git = "https://github.com/cartridge-gg/vrf", rev = "cc00aa61fa5157100cde134fac3148f318448e18" }

[dev-dependencies]
snforge_std = "0.64.1"
assert_macros = "2.20.0"

[[target.starknet-contract]]
sierra = true
casm = true

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool.snforge]
fuzzer_runs = 100
fuzzer_seed = 1111
tracked_resource = "sierra-gas"
